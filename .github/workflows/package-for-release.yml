name: CMake on multiple platforms

on:
  push:
    branches: ["main"] # on every push to the main branch
    tags: ["v*"] # on every tag creation starting with "v" (e.g. v1.0.0)
  pull_request:
    branches: ["main"] # on every pull request targeting main
  workflow_dispatch: # allows manually triggering the workflow from the GitHub UI

jobs:
  build:
    # The job runs on the OS dynamically defined by the matrix below
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false # if one OS fails, the others keep running
      matrix:
        # Defines 3 configurations that will run in parallel
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            artifact_name: keypr-linux-x64
            archive_name: keypr-linux-x64.AppImage
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            artifact_name: keypr-windows-x64
            archive_name: keypr-windows-x64.zip
          - os: macos-14
            c_compiler: clang
            cpp_compiler: clang++
            artifact_name: keypr-macos-arm64
            archive_name: keypr-macos-arm64.zip

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # checks out all submodules recursively

      # Installs Qt
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"

      # libsodium (pulled in via keypr-core's vcpkg manifest) is built from
      # source by vcpkg on Linux/macOS, which needs an autotools toolchain
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install autoconf autoconf-archive automake libtool pkg-config

      # No additional dependencies required for Windows

      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: "${{ github.workspace }}/vcpkg"
          vcpkgGitCommitId: "7f3781e19cc7d4e4882a4caec01668c6f7b5c163"

      # Windows: Converts logo.png into .ico files using ImageMagick
      - name: Generate Windows icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install imagemagick --no-progress -y
          magick resources/logo.png -define icon:auto-resize=16,24,32,48,64,128,256 resources/app_icon.ico

      # macOS: generates a .icns file
      - name: Generate macOS icon
        if: runner.os == 'macOS'
        shell: bash
        # Generates every resolution required by the .iconset format
        run: |
          set -euo pipefail
          ICONSET_DIR="resources/app_icon.iconset"

          rm -rf "$ICONSET_DIR"
          mkdir -p "$ICONSET_DIR"

          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" \
              resources/logo.png \
              --out "$ICONSET_DIR/icon_${size}x${size}.png"

            double_size=$((size * 2))

            sips -z "$double_size" "$double_size" \
              resources/logo.png \
              --out "$ICONSET_DIR/icon_${size}x${size}@2x.png"
          done

          iconutil -c icns "$ICONSET_DIR" -o resources/app_icon.icns
          rm -rf "$ICONSET_DIR"

      # Defines reusable path strings as step outputs to avoid repeating the same paths every time
      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          echo "install-output-dir=${{ github.workspace }}/install" >> "$GITHUB_OUTPUT"
          echo "cmake-source-dir=${{ github.workspace }}" >> "$GITHUB_OUTPUT"
          echo "archive-path=${{ github.workspace }}/${{ matrix.archive_name }}" >> "$GITHUB_OUTPUT"

      # CMake configuration: generates build files in build/, using the compilers and build type specified by the matrix
      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -S ${{ steps.strings.outputs.cmake-source-dir }}

      # Compiles the project in Release mode
      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

      # Installs the compiled binaries into a clean install/ folder
      - name: Install
        run: >
          cmake --install ${{ steps.strings.outputs.build-output-dir }}
          --config Release
          --prefix ${{ steps.strings.outputs.install-output-dir }}

      # windeployqt automatically copies the required Qt DLLs next to the Windows executable
      - name: Deploy Qt dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Adds the Qt bin/ folder to PATH so windeployqt can find the Qt DLLs
        run: |
          $env:PATH += ";${{ steps.strings.outputs.install-output-dir }}"
          windeployqt --release --no-translations "${{ steps.strings.outputs.install-output-dir }}\bin\qt_client.exe"

      # bundles the required Qt frameworks into the .app bundle so it can run on machines without Qt installed
      - name: Deploy Qt dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          macdeployqt "${{ steps.strings.outputs.install-output-dir }}/qt_client.app"

      # Runs the test suite via CTest
      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config Release

      - name: Create Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p AppDir/usr/bin

          cp install/bin/qt_client AppDir/usr/bin/qt_client

          cat > AppDir/qt_client.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Keypr
          Exec=qt_client
          Icon=qt_client
          Categories=Utility;
          EOF

          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Optional: only if this file exists in your repository
          if [ -f resources/logo.png ]; then
            cp resources/logo.png \
              AppDir/usr/share/icons/hicolor/256x256/apps/qt_client.png
          fi

          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy.AppImage

          wget -q \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
            -O linuxdeploy-plugin-qt.AppImage

          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage

          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage

          mv Keypr*.AppImage keypr-linux-x64.AppImage

      # Windows: packages the install/ folder into a .zip archive
      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ steps.strings.outputs.install-output-dir }}\*" -DestinationPath "${{ steps.strings.outputs.archive-path }}" -Force

      # macOS: verifies the .app bundle exists, self-signs it then packages it into a .zip
      - name: Package macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        # Self-signs the .app bundle with an ad-hoc signature
        # Verifies the signature is valid and the app bundle is not corrupted
        # Creates a .zip archive of the .app bundle, preserving metadata
        run: |
          APP_PATH="${{ steps.strings.outputs.install-output-dir }}/qt_client.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app bundle not found at $APP_PATH"
            ls -la "${{ steps.strings.outputs.install-output-dir }}"
            exit 1
          fi

          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "${{ steps.strings.outputs.archive-path }}"

      # Uploads the resulting archive as a GitHub Actions artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.strings.outputs.archive-path }}

  release:
    needs: build # waits for the build job on all OS variants to finish
    if: github.event_name == 'push' # only runs on pushes, not on pull requests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Downloads all artifacts uploaded by the build job's matrix runs into ./dist
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # check for fails early and if any expected archive is missing
      - name: Verify downloaded artifacts
        shell: bash
        run: |
          test -f "./dist/keypr-linux-x64/keypr-linux-x64.AppImage"
          test -f "./dist/keypr-windows-x64/keypr-windows-x64.zip"
          test -f "./dist/keypr-macos-arm64/keypr-macos-arm64.zip"

      # Publishes/updates a pre-release for the main branch (overwrites the previous rolling release)
      - name: Publish rolling release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-main
          name: "Latest build (main)"
          body: |
            Latest automatic build from the `main` branch.
            Commit: ${{ github.sha }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            ./dist/keypr-linux-x64/keypr-linux-x64.AppImage
            ./dist/keypr-windows-x64/keypr-windows-x64.zip
            ./dist/keypr-macos-arm64/keypr-macos-arm64.zip

      # Publishes an official versioned release when a "v*" tag is pushed
      - name: Publish versioned release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            ./dist/keypr-linux-x64/keypr-linux-x64.AppImage
            ./dist/keypr-windows-x64/keypr-windows-x64.zip
            ./dist/keypr-macos-arm64/keypr-macos-arm64.zip
