name: Build and test

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: keypr-linux-x64
          - os: windows-latest
            artifact: keypr-windows-x64
          - os: macos-14
            artifact: keypr-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install autoconf autoconf-archive automake libtool pkg-config

      # No additionnal dependencies required for Windows

      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: "${{ github.workspace }}/vcpkg"
          vcpkgGitCommitId: "7f3781e19cc7d4e4882a4caec01668c6f7b5c163"

      - name: Configure
        run: >
          cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Determine build parallelism on Linux
        if: runner.os == 'Linux'
        id: linux_cpu
        shell: bash
        run: echo "jobs=$(nproc)" >> "$GITHUB_OUTPUT"

      - name: Determine build parallelism on macOS
        if: runner.os == 'macOS'
        id: macos_cpu
        shell: bash
        run: echo "jobs=$(sysctl -n hw.ncpu)" >> "$GITHUB_OUTPUT"

      - name: Determine build parallelism on Windows
        if: runner.os == 'Windows'
        id: windows_cpu
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_OUTPUT -Value "jobs=$env:NUMBER_OF_PROCESSORS"

      - name: Build
        run: cmake --build build --config Release --parallel ${{ steps.linux_cpu.outputs.jobs || steps.macos_cpu.outputs.jobs || steps.windows_cpu.outputs.jobs }}

      - name: Test
        working-directory: build
        run: ctest --build-config Release --output-on-failure

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/qt_client
            build/Release/qt_client.exe
            build/qt_client.app
