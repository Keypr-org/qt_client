name: CMake on multiple platforms

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            artifact_name: keypr-linux-x64
            archive_name: keypr-linux-x64.AppImage
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            artifact_name: keypr-windows-x64
            archive_name: keypr-windows-x64.zip
          - os: macos-14
            c_compiler: clang
            cpp_compiler: clang++
            artifact_name: keypr-macos-arm64
            archive_name: keypr-macos-arm64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"

      - name: Generate Windows icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install imagemagick --no-progress -y
          magick resources/logo.png -define icon:auto-resize=16,24,32,48,64,128,256 resources/app_icon.ico

      - name: Generate macOS icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ICONSET_DIR="resources/app_icon.iconset"

          rm -rf "$ICONSET_DIR"
          mkdir -p "$ICONSET_DIR"

          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" \
              resources/logo.png \
              --out "$ICONSET_DIR/icon_${size}x${size}.png"

            double_size=$((size * 2))

            sips -z "$double_size" "$double_size" \
              resources/logo.png \
              --out "$ICONSET_DIR/icon_${size}x${size}@2x.png"
          done

          iconutil -c icns "$ICONSET_DIR" -o resources/app_icon.icns
          rm -rf "$ICONSET_DIR"

      - name: Prepare Linux icon
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cp resources/logo.png resources/app_icon.png

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          echo "install-output-dir=${{ github.workspace }}/install" >> "$GITHUB_OUTPUT"
          echo "cmake-source-dir=${{ github.workspace }}" >> "$GITHUB_OUTPUT"
          echo "archive-path=${{ github.workspace }}/${{ matrix.archive_name }}" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -S ${{ steps.strings.outputs.cmake-source-dir }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

      - name: Install
        run: >
          cmake --install ${{ steps.strings.outputs.build-output-dir }}
          --config Release
          --prefix ${{ steps.strings.outputs.install-output-dir }}

      - name: Deploy Qt dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH += ";${{ steps.strings.outputs.install-output-dir }}"
          windeployqt --release --no-translations `
            "${{ steps.strings.outputs.install-output-dir }}\bin\qt_client.exe"

      - name: Deploy Qt dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          macdeployqt \
            "${{ steps.strings.outputs.install-output-dir }}/qt_client.app"

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config Release

      - name: Install appimagetool dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf fuse libfuse2 libicu-dev

      - name: Download appimagetool (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

      - name: Prepare AppDir structure (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          APPDIR_BASE="${{ steps.strings.outputs.install-output-dir }}"
          APPDIR="${APPDIR_BASE}/keypr.AppDir"
          
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/lib"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/512x512/apps"

          # Copy binary
          cp "${APPDIR_BASE}/bin/qt_client" "$APPDIR/usr/bin/"

          # Copy icon
          cp resources/app_icon.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/app_icon.png"
          cp resources/app_icon.png "$APPDIR/app_icon.png"

          # Create .desktop file
          cat > "$APPDIR/keypr.desktop" <<'DESKTOPEOF'
[Desktop Entry]
Type=Application
Name=keypr
Exec=qt_client
Icon=app_icon
Categories=Utility;
DESKTOPEOF
          cp "$APPDIR/keypr.desktop" "$APPDIR/usr/share/applications/keypr.desktop"

          # Copy Qt libraries
          QT_LIB_PATH=$(qmake -query QT_INSTALL_LIBS)
          cp "$QT_LIB_PATH"/libQt6Core.so.6* "$APPDIR/usr/lib/" 2>/dev/null || true
          cp "$QT_LIB_PATH"/libQt6Gui.so.6* "$APPDIR/usr/lib/" 2>/dev/null || true
          cp "$QT_LIB_PATH"/libQt6Widgets.so.6* "$APPDIR/usr/lib/" 2>/dev/null || true
          cp "$QT_LIB_PATH"/libQt6DBus.so.6* "$APPDIR/usr/lib/" 2>/dev/null || true
          cp "$QT_LIB_PATH"/libQt6XcbQpa.so.6* "$APPDIR/usr/lib/" 2>/dev/null || true

          # Copy ICU libraries (critical for Qt6)
          cp /usr/lib/x86_64-linux-gnu/libicui18n.so* "$APPDIR/usr/lib/" 2>/dev/null || true
          cp /usr/lib/x86_64-linux-gnu/libicuuc.so* "$APPDIR/usr/lib/" 2>/dev/null || true
          cp /usr/lib/x86_64-linux-gnu/libicudata.so* "$APPDIR/usr/lib/" 2>/dev/null || true

          # Copy other Qt dependencies
          cp /usr/lib/x86_64-linux-gnu/libssl.so* "$APPDIR/usr/lib/" 2>/dev/null || true
          cp /usr/lib/x86_64-linux-gnu/libcrypto.so* "$APPDIR/usr/lib/" 2>/dev/null || true

          # Copy plugins
          QT_PLUGIN_PATH=$(qmake -query QT_INSTALL_PLUGINS)
          mkdir -p "$APPDIR/usr/lib/qt6/plugins"
          cp -r "$QT_PLUGIN_PATH"/platforms "$APPDIR/usr/lib/qt6/plugins/" 2>/dev/null || true
          cp -r "$QT_PLUGIN_PATH"/imageformats "$APPDIR/usr/lib/qt6/plugins/" 2>/dev/null || true
          cp -r "$QT_PLUGIN_PATH"/xcbglintegrations "$APPDIR/usr/lib/qt6/plugins/" 2>/dev/null || true

          # Create AppRun script
          cat > "$APPDIR/AppRun" <<'APPRUNEOF'
#!/bin/bash
APPDIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
export LD_LIBRARY_PATH="$APPDIR/usr/lib:$LD_LIBRARY_PATH"
export QT_PLUGIN_PATH="$APPDIR/usr/lib/qt6/plugins"
export QT_QPA_PLATFORM_PLUGIN_PATH="$APPDIR/usr/lib/qt6/plugins/platforms"
exec "$APPDIR/usr/bin/qt_client" "$@"
APPRUNEOF
          chmod +x "$APPDIR/AppRun"

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          APPDIR_BASE="${{ steps.strings.outputs.install-output-dir }}"
          APPDIR="${APPDIR_BASE}/keypr.AppDir"
          ARCHIVE_PATH="${{ steps.strings.outputs.archive-path }}"
          
          # Verify .desktop exists before packaging
          if [ ! -f "$APPDIR/keypr.desktop" ]; then
            echo "Error: .desktop file not found at $APPDIR/keypr.desktop"
            exit 1
          fi
          
          ./appimagetool -n "$APPDIR" "$ARCHIVE_PATH"
          chmod +x "$ARCHIVE_PATH"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "${{ steps.strings.outputs.install-output-dir }}\*" `
            -DestinationPath "${{ steps.strings.outputs.archive-path }}" `
            -Force

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_PATH="${{ steps.strings.outputs.install-output-dir }}/qt_client.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app bundle not found at $APP_PATH"
            ls -la "${{ steps.strings.outputs.install-output-dir }}"
            exit 1
          fi

          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "${{ steps.strings.outputs.archive-path }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.strings.outputs.archive-path }}

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Verify downloaded artifacts
        shell: bash
        run: |
          test -f "./dist/keypr-linux-x64/keypr-linux-x64.AppImage"
          test -f "./dist/keypr-windows-x64/keypr-windows-x64.zip"
          test -f "./dist/keypr-macos-arm64/keypr-macos-arm64.zip"

      - name: Publish rolling release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-main
          name: "Latest build (main)"
          body: |
            Dernier build automatique de la branche `main`.
            Commit : ${{ github.sha }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            ./dist/keypr-linux-x64/keypr-linux-x64.AppImage
            ./dist/keypr-windows-x64/keypr-windows-x64.zip
            ./dist/keypr-macos-arm64/keypr-macos-arm64.zip

      - name: Publish versioned release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            ./dist/keypr-linux-x64/keypr-linux-x64.AppImage
            ./dist/keypr-windows-x64/keypr-windows-x64.zip
            ./dist/keypr-macos-arm64/keypr-macos-arm64.zip
