name: CMake on multiple platforms

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            artifact_name: keypr-linux-x64
            archive_name: keypr-linux-x64.tar.gz
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            artifact_name: keypr-windows-x64
            archive_name: keypr-windows-x64.zip
          - os: macos-14
            c_compiler: clang
            cpp_compiler: clang++
            artifact_name: keypr-macos-arm64
            archive_name: keypr-macos-arm64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          echo "install-output-dir=${{ github.workspace }}/install" >> "$GITHUB_OUTPUT"
          echo "cmake-source-dir=${{ github.workspace }}" >> "$GITHUB_OUTPUT"
          echo "archive-path=${{ github.workspace }}/${{ matrix.archive_name }}" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -S ${{ steps.strings.outputs.cmake-source-dir }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

      - name: Install
        run: >
          cmake --install ${{ steps.strings.outputs.build-output-dir }}
          --config Release
          --prefix ${{ steps.strings.outputs.install-output-dir }}

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config Release

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -C "${{ steps.strings.outputs.install-output-dir }}" -czf "${{ steps.strings.outputs.archive-path }}" .

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ steps.strings.outputs.install-output-dir }}\*" -DestinationPath "${{ steps.strings.outputs.archive-path }}" -Force

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_PATH="${{ steps.strings.outputs.install-output-dir }}/keypr.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app bundle not found at $APP_PATH"
            ls -la "${{ steps.strings.outputs.install-output-dir }}"
            exit 1
          fi
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "${{ steps.strings.outputs.archive-path }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.strings.outputs.archive-path }}

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Verify downloaded artifacts
        shell: bash
        run: |
          test -f "./dist/keypr-linux-x64/keypr-linux-x64.tar.gz"
          test -f "./dist/keypr-windows-x64/keypr-windows-x64.zip"
          test -f "./dist/keypr-macos-arm64/keypr-macos-arm64.zip"

      - name: Publish rolling release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-main
          name: "Latest build (main)"
          body: |
            Dernier build automatique de la branche `main`.
            Commit : ${{ github.sha }}
          prerelease: true
          make_latest: false
          # Écrase les fichiers/tag existants à chaque push
          fail_on_unmatched_files: true
          files: |
            ./dist/keypr-linux-x64/keypr-linux-x64.tar.gz
            ./dist/keypr-windows-x64/keypr-windows-x64.zip
            ./dist/keypr-macos-arm64/keypr-macos-arm64.zip

      - name: Publish versioned release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            ./dist/keypr-linux-x64/keypr-linux-x64.tar.gz
            ./dist/keypr-windows-x64/keypr-windows-x64.zip
            ./dist/keypr-macos-arm64/keypr-macos-arm64.zip
